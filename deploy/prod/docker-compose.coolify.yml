# Dev-контур intake в Coolify. Источник правды - этот файл: workflow
# синхронизирует его в Coolify перед каждым выкатом, править в UI нельзя.
# Шага backup здесь нет: в dev нет данных, потерю которых стоит переживать.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: intake
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    exclude_from_hc: true
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://intake:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/intake?sslmode=disable
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    environment:
      DATABASE_URL: postgres://intake:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/intake?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:?TELEGRAM_ALLOWED_IDS must be set}
      # Пусто - идём напрямую: с узла A api.telegram.org отвечает без прокси.
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      # Чат уведомлений владельца и токен бота, которым туда пишут. Пустой чат
      # выключает уведомления, пустой токен отдаёт отправку боту сервиса.
      ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}
      ALERT_BOT_TOKEN: ${ALERT_BOT_TOKEN:-}
      # Тема группы уведомлений (message_thread_id). Пусто - без темы, как
      # раньше: общий чат, не тема 5 «Galera Alerts».
      ALERT_THREAD_ID: ${ALERT_THREAD_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      # Пусто - идём напрямую: с узла A OpenRouter отвечает без прокси. Адрес
      # прокси, если понадобится, - секрет контура, в репозиторий не попадает.
      OPENROUTER_PROXY: ${OPENROUTER_PROXY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set}
      # Доска организации для новых тикетов; пусто - тикеты на доску не ставятся.
      GITHUB_BOARD_ID: ${GITHUB_BOARD_ID:-}
      # Дефолты модели и лимитов лежат в config.go: пустая переменная означает
      # дефолт, а не пустое значение. Копия значений здесь молча разъехалась бы
      # с кодом.
      OPENROUTER_MODEL_MEDIA: ${OPENROUTER_MODEL_MEDIA:-}
      OPENROUTER_MODEL_DIALOG: ${OPENROUTER_MODEL_DIALOG:-}
      MAX_ITEMS: ${MAX_ITEMS:-}
      INTERVIEW_ROUNDS: ${INTERVIEW_ROUNDS:-}
      AUDIO_CONVERT: ${AUDIO_CONVERT:-}
      # Стартовый набор проектов: имена и адреса внутренних репозиториев живут
      # только в переменной Coolify, репозиторий сервиса публичный. Вставляет
      # недостающие строки, существующие не трогает - проекты правятся командой
      # /project в боте.
      PROJECTS: ${PROJECTS:-}
      MEDIA_DIR: /tmp/intake
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: dev
    # Файлы обращения живут минуты и стираются после нормализации: диску их
    # переживать незачем. Режим задан явно: без него 1777 только на первом
    # старте, на повторном (перезагрузка узла) tmpfs берёт 755 от точки
    # монтирования, и nonroot не пишет. 1023 = 01777: запись с ведущим нулём
    # Compose разбирает строкой.
    volumes:
      - type: tmpfs
        target: /tmp/intake
        tmpfs:
          size: 268435456
          mode: 1023
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Проверяет базу и свежесть отметки опроса Telegram: контейнер с живой
      # базой и молчащим поллером здоровым не считается. Запас на старт больше
      # цикла опроса - первая отметка появляется только после getUpdates.
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

volumes:
  postgres_data:
