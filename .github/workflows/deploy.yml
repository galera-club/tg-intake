name: Deploy

# Деплой по неизменяемому тегу v*: проверки, immutable образ sha-<commit>,
# перевыкат Coolify-сервиса. Автодеплоя по push нет: ветка одна, релиз - тег.
# Репозиторий публичный, поэтому адрес Coolify и UUID сервиса живут в секретах,
# а сборка и деплой выполняются только для владельца.

# Триггер по тегу снят 28.08.2026: GitHub Actions не используются, релиз
# катается вручную через galera-dev-knowledge/infra/scripts/coolify-deploy.sh.
# Вернуть push по тегу вместе с self-hosted раннером.
on:
  workflow_dispatch:

permissions:
  contents: read

# Без cancel-in-progress: отмена между сменой APP_IMAGE и запуском выката
# оставила бы в Coolify образ, который никто не разворачивал, и контур
# числился бы на коммите, который не крутится.
concurrency:
  group: intake-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/galera-club/tg-intake

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: intake
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: intake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake -d intake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src
    env:
      DATABASE_URL: postgres://intake:intake@localhost:5432/intake?sslmode=disable
      TEST_DATABASE_URL: postgres://intake:intake@localhost:5432/intake?sslmode=disable
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.2
          working-directory: src
          install-only: true

      - name: Checks
        run: make ci-check

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: checks
    if: github.actor == 'daniil4545' && github.triggering_actor == 'daniil4545'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          # Только immutable-тег: плавающий :latest создавал бы второй,
          # неотслеживаемый способ выката.
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy intake
    runs-on: ubuntu-latest
    needs: build
    if: github.actor == 'daniil4545' && github.triggering_actor == 'daniil4545'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      # Имена секретов исторические: сервис в Coolify заведён как intake-dev,
      # с релиза 0.1.0 этот контур и есть прод.
      - name: Sync Compose to Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_BASE: ${{ secrets.COOLIFY_API_BASE }}
          COOLIFY_DEV_SERVICE_UUID: ${{ secrets.COOLIFY_DEV_SERVICE_UUID }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN" && test -n "$COOLIFY_API_BASE" && test -n "$COOLIFY_DEV_SERVICE_UUID"
          jq -n --arg c "$(base64 -w 0 deploy/prod/docker-compose.coolify.yml)" '{docker_compose_raw: $c}' > payload.json
          curl --fail --silent --show-error --request PATCH \
            "${COOLIFY_API_BASE}/services/${COOLIFY_DEV_SERVICE_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @payload.json \
            --output /dev/null
          rm payload.json

      - name: Update image and deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_BASE: ${{ secrets.COOLIFY_API_BASE }}
          COOLIFY_DEV_SERVICE_UUID: ${{ secrets.COOLIFY_DEV_SERVICE_UUID }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          curl --fail --silent --show-error --request PATCH \
            "${COOLIFY_API_BASE}/services/${COOLIFY_DEV_SERVICE_UUID}/envs" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"key\":\"APP_IMAGE\",\"value\":\"${image}\"}" \
            --output /dev/null
          # force=true обязателен для Compose-сервиса: без него Coolify отвечает
          # «Service started», видит сервис уже запущенным и контейнеры не
          # пересоздаёт - контур остаётся на прежнем образе при зелёном workflow.
          #
          # Ответ печатаем по той же причине: HTTP 200 приходит и тогда, когда
          # выкат не начат, а причина лежит в теле.
          #
          # POST, а не GET: с Coolify 4.2.0 изменяющие ручки отвечают на GET 405.
          response=$(curl --fail --silent --show-error --request POST \
            "${COOLIFY_API_BASE}/deploy?uuid=${COOLIFY_DEV_SERVICE_UUID}&force=true" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}")
          echo "coolify response: ${response}"
          echo "${response}" | grep -q "deployments" || {
            echo "Coolify не принял выкат" >&2
            exit 1
          }
          echo "intake deploy queued for sha-${GITHUB_SHA}"
