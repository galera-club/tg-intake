name: CI

# Автотриггер снят 28.08.2026: GitHub Actions не используются, проверки идут
# локально (make ci-check). Вернуть pull_request вместе с self-hosted раннером.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: intake
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: intake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake -d intake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src
    env:
      DATABASE_URL: postgres://intake:intake@localhost:5432/intake?sslmode=disable
      TEST_DATABASE_URL: postgres://intake:intake@localhost:5432/intake?sslmode=disable
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.13.2
          working-directory: src
          install-only: true

      # Один список проверок, он же локальный: миграции, тесты, vet, fmt, lint, security, build.
      - name: Checks
        run: make ci-check

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      # Без сборки в PR первый выкат стал бы и первой сборкой Dockerfile:
      # ошибка многостадийной сборки под distroless вылезла бы в деплое.
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VCS_REF=${{ github.sha }}
